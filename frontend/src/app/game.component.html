<app-phase-bubble *ngIf="!isGameEnded || !isMeDead"></app-phase-bubble>
<app-toast *ngIf="!isGameEnded || !isMeDead"></app-toast>
<main class="container">
  <button class="lobby-btn" *ngIf="!isGameEnded && !isMeDead" (click)="back()">← Retour Lobby</button>
  <button class="leave-btn" *ngIf="!isGameEnded && !isMeDead" (click)="leave()">
    Abandonner
  </button>

  <button class="leave-btn" *ngIf="!isGameEnded && isMeDead" (click)="leaveAfterDeath()">
    Quitter
  </button>
  <h2 style="margin: 0px;">Raid {{ game?.raid }} — {{ game?.phase || '...' }}</h2>

  <div *ngIf="errorMsg" class="error-msg">
    {{ errorMsg }}
  </div>

  <!-- BOARD HAUT: chasseurs -->
  <app-hunters-row [cards]="hunterCards" [zoom]="zoom"></app-hunters-row>

  <!-- LIGNE MILIEU -->
  <section class="board-wide-center boards-row" [class.no-left]="!hasVampire || isMeVampire">
    <!-- gauche: stats vampire -->
    <app-vampire-panel *ngIf="hasVampire && !isMeVampire"
      [vampire]="vampirePlayer" [chips]="chipsFor(vampirePlayer)" [zoom]="zoom"></app-vampire-panel>


    <!-- centre: plateau -->
    <!-- centre: plateau (fil live + cartes + historique) -->
    <app-center-board *ngIf="game"
      [vm]="centerBoardVm" [actions]="centerBoardActions" [helpers]="centerBoardHelpers" [zoom]="zoom"></app-center-board>



    <!-- droite: decks actions + potions -->
    <app-decks-panel [decks]="game?.decks" [zoom]="zoom"></app-decks-panel>
  </section>

  <!-- BOARD BAS: moi -->
  <app-my-board *ngIf="me && game"
    [vm]="myBoardVm" [actions]="myBoardActions" [helpers]="myBoardHelpers" [zoom]="zoom"></app-my-board>
</main>

<!-- === MODALE METEO (PHASE0) === -->
<app-weather-modal [show]="canShowWeatherModal()" [weatherBgActive]="weatherBgActive"
  [weatherBgImage]="setImageBackground('weather')" [isWeatherPreReveal]="isWeatherPreReveal()"
  [isMeVampire]="isMeVampire" [weatherRoll]="game?.weather?.roll ?? null" [weatherNameFr]="game?.weather?.nameFr"
  [weatherDescFr]="game?.weather?.descFr" [weatherStatus]="game?.weather?.status"
  [weatherIconTransform]="weatherIconTransform()" [weatherIconSrc]="weatherIconSrc(game?.weather?.status!)"
  (roll)="rollWeather()">
</app-weather-modal>

<!-- === MODALE ROLL (joueur concerné) === -->
<div *ngIf="rollVm.show && rollVm.combat.currentCombat" class="modal-backdrop">
  <app-roll-modal [vm]="rollVm" [actions]="rollActions"></app-roll-modal>
</div>

<!-- === MODALE SPECTATEUR === -->
<div *ngIf="spectateVm.show && spectateVm.combat" class="modal-backdrop">
  <app-spectate-modal [vm]="spectateVm"></app-spectate-modal>
</div>

<!-- === MODALE MORSURE (PHASE3, quand currentBite actif) === -->
<app-bite-modal [show]="showBiteModal && !isGameEnded" [backgroundImage]="setImageBackground('bite')"
  [biteRoll]="game?.currentBite?.roll" [armorRoll]="game?.currentBite?.armorRoll" [showArmorDice]="showArmorDice"
  [biteStage]="biteStage()" [canRollBite]="canRollBite()" [canRollArmor]="canRollArmor()"
  [biteResultText]="biteResultText()" [altarRitualText]="altarRitualText()" (rollCorruption)="rollCorruption()"
  (rollArmor)="rollArmor()">
</app-bite-modal>

<!-- === MODALE CHOIX INSTABLE (PREPHASE3) === -->
<app-corruption-modal [show]="showUnstableModal()" [backgroundImage]="setImageBackground('corruption')"
  [unstableChoices]="unstableChoices" [isMeVampire]="isMeVampire" [vampireName]="vampireName()"
  [usernameOf]="usernameOf.bind(this)" [labelLocation]="labelLocation.bind(this)"
  [getUnstableDefaultFight]="getUnstableDefaultFight.bind(this)" [isUnstableLocked]="isUnstableLocked.bind(this)"
  [isUnstableAlreadyDecided]="isUnstableAlreadyDecided.bind(this)" [isPendingUnstable]="isPendingUnstable.bind(this)"
  [trackByUnstable]="trackByUnstable.bind(this)"
  (assignTarget)="assignUnstableTarget($event.unstableId, $event.targetId)"
  (assignHarvest)="assignUnstableHarvest($event.unstableId, $event.location)"
  (assignNothing)="assignUnstableNothing($event)">
</app-corruption-modal>

<!-- ===== MODALE BOUTIQUE / TRANSMUTATION (Phase 4) ===== -->
<div *ngIf="shopVm.show" class="modal-backdrop">
  <app-shop-modal [vm]="shopVm" [actions]="shopActions" [helpers]="shopHelpers"></app-shop-modal>
</div>

<!-- ===== MODALE ACTION ===== -->
<div class="modal-backdrop" *ngIf="actionVm.show">
  <app-action-modal [vm]="actionVm" [actions]="actionActions" [helpers]="actionHelpers"></app-action-modal>
</div>

<!-- ===== MODALE CHOIX DE CONSTRUCTION ===== -->
<div class="modal-backdrop" *ngIf="buildVm.show">
  <app-build-modal [vm]="buildVm" [actions]="buildActions" [helpers]="buildHelpers"></app-build-modal>
</div>

<!-- ===== MODALE CONFIRMATION CONSTRUCTION ===== -->
<div class="modal-backdrop" *ngIf="buildConfirmVm.show">
  <app-build-confirm-modal [vm]="buildConfirmVm" [actions]="buildConfirmActions"></app-build-confirm-modal>
</div>

<!-- ===== MODALE SELECTION EFFET DE LIEU: LIBRARY ===== -->
<div class="modal-backdrop" *ngIf="selectLibraryEffectVm.show">
  <app-select-library-effect-modal [vm]="selectLibraryEffectVm"
    [actions]="selectLibraryEffectActions"></app-select-library-effect-modal>
</div>
<!-- ===== MODALE SELECTION EFFET DE LIEU : LABORATORY ===== -->
<div class="modal-backdrop" *ngIf="selectLaboratoryEffectVm.show">
  <app-select-laboratory-effect-modal [vm]="selectLaboratoryEffectVm"
    [actions]="selectLaboratoryEffectActions"></app-select-laboratory-effect-modal>
</div>
<!-- ===== MODALE SELECTION EFFET DE LIEU : BALLROOM ===== -->
<div class="modal-backdrop" *ngIf="selectBallroomEffectVm.show">
  <app-select-ballroom-effect-modal [vm]="selectBallroomEffectVm"
    [actions]="selectBallroomEffectActions"></app-select-ballroom-effect-modal>
</div>
<!-- ===== MODALE SELECTION EFFET DE LIEU : ALTAR ===== -->
<div class="modal-backdrop" *ngIf="selectAltarEffectVm.show">
  <app-select-altar-effect-modal [vm]="selectAltarEffectVm"
    [actions]="selectAltarEffectActions"></app-select-altar-effect-modal>
</div>
<!-- ===== MODALE SELECTION EFFET DE LIEU: FORGE ===== -->
<div class="modal-backdrop" *ngIf="selectForgeEffectVm.show">
  <app-select-forge-effect-modal [vm]="selectForgeEffectVm"
    [actions]="selectForgeEffectActions"></app-select-forge-effect-modal>
</div>
<!-- ===== MODALE UTILISATION EFFET DE LIEU ===== -->
<div class="modal-backdrop" *ngIf="useLocationEffectVm.show">
  <app-use-location-effect-modal [vm]="useLocationEffectVm"
    [actions]="useLocationEffectActions"></app-use-location-effect-modal>
</div>
<!-- Modale de mort (game pas finie) -->
<app-death-modal [show]="showDeathModal" (observe)="observeAfterDeath()" (leave)="leaveAfterDeath()"></app-death-modal>
<!-- Modale de fin de partie -->
<app-end-game-modal [show]="isGameEnded" [title]="winnerTitle()" [subtitle]="winnerSubtitle()"
  (leave)="leaveAfterEnd()"></app-end-game-modal>
<app-zoom-overlay [show]="zoomOn" [zoomStyle]="zoomStyle" [zoomMediaW]="zoomMediaW" [zoomMediaH]="zoomMediaH"
  [zoomSrc]="zoomSrc" [zoomBadgeOn]="zoomBadgeOn" [zoomBadgeIsHunter]="zoomBadgeIsHunter"
  [zoomBadgeText]="zoomBadgeText" [zoomInfoOn]="zoomInfoOn" [zoomInfoKey]="zoomInfoKey" [zoomInfoLines]="zoomInfoLines"
  [hasZoomInfoLines]="hasZoomInfoLines" [zoomInfoLinesHunter]="zoomInfoLinesHunter"
  [zoomInfoLinesVamp]="zoomInfoLinesVamp" [zoomInfoNote]="zoomInfoNote" [forgeCostGroups]="forgeCostGroups">
</app-zoom-overlay>
