<div *ngIf="show" class="modal-backdrop">
    <div class="modal weather-modal" [ngClass]="{ 'with-bg': weatherBgActive }"
        [style.backgroundImage]="weatherBgActive ? weatherBgImage : null">
        <h3 style="margin-top:0; color:white;">{{'Tirage météo'}}</h3>

        <!-- AVANT affichage du fond météo : roue + dé (avec overlay résultat) -->
        <ng-container *ngIf="isWeatherPreReveal; else weatherResult">
            <div class="content weather">
                <div class="wheel-wrap">
                    <img class="wheel" src="/assets/weather/meteo_wheel.png" alt="roue météo" />
                    <!-- icône météo posée sur la pale tirée -->
                    <div class="badge-weather" *ngIf="weatherStatus && weatherRoll != null"
                        [style.transform]="weatherIconTransform">
                        <img class="weather-ico" [src]="weatherIconSrc" alt="icône météo" />
                    </div>
                </div>

                <div class="dice-wrap" style="margin-top:1rem" [attr.data-digits]="(weatherRoll ?? 0) > 9 ? 2 : 1">
                    <img class="dice" src="/assets/dices/d12-red.png" alt="d12" />
                    <div class="dice-overlay" *ngIf="weatherRoll != null">
                        {{ weatherRoll }}
                    </div>
                </div>
            </div>

            <div class="footer">
                <ng-container *ngIf="isMeVampire && weatherRoll == null; else waitWeather">
                    <button (click)="roll.emit()" class="btn-primary">Jeter le dé</button>
                </ng-container>
                <ng-template #waitWeather>
                    <span *ngIf="weatherRoll == null">En attente du tirage…</span>
                    <span class="weather-footer" *ngIf="weatherRoll != null">{{ weatherNameFr }}</span>
                </ng-template>
            </div>
        </ng-container>

        <!-- APRES le délai : fond météo + texte -->
        <ng-template #weatherResult>
            <div class="content weather result">
                <div class="weather-badge">{{ weatherNameFr }}</div>
                <p class="weather-desc">{{ weatherDescFr }}</p>
            </div>
        </ng-template>
    </div>
</div>
