server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ------------------------------------------------------------
  # 1) IMPORTANT: ne pas cacher index.html (sinon vieilles releases)
  # Comme la SPA renvoie index.html sur /, /route, etc., on met
  # no-cache sur la location / (les assets ont leurs locations dédiées).
  # ------------------------------------------------------------
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }

  # ------------------------------------------------------------
  # 2) Images & assets : cache 1 jour
  # ------------------------------------------------------------
  location ^~ /assets/ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # (optionnel) icônes à la racine si tu en as
  location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # (optionnel) fonts/js/css : si tu veux aussi 1 jour (simple)
  location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }
}
